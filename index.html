<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loto Bénin - Pro Cockpit</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2980b9" />
<link rel="icon" type="image/png" href="./logo.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<a href="#contenu-principal" class="skip-link">Aller au contenu principal</a>

<div id="login-screen" role="dialog" aria-modal="true" aria-labelledby="loginTitre" class="login-screen">
  <div class="login-box">
    <header class="login-header">
      <img src="./logo.png" alt="Logo Loto Bénin" class="login-logo" />
      <h1 id="loginTitre" class="login-title">Loto Bénin</h1>
      <p class="login-subtitle">Portail d'accès</p>
    </header>

    <section id="form-connexion">
      <label for="loginEmail" class="sr-only">Adresse email</label>
      <input type="email" id="loginEmail" placeholder="Adresse email" autocomplete="username" required />
      <label for="loginPassword" class="sr-only">Mot de passe</label>
      <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password" required />
      <button class="btn-principal" onclick="seConnecter()">Se connecter</button>
      <button class="btn-visiteur" onclick="entrerVisiteur()">👁️ Entrer en mode Visiteur</button>
      <button class="lien-switch" onclick="afficherInscription()">Pas encore de compte ? S'inscrire</button>
    </section>

    <section id="form-inscription" hidden>
      <p class="form-info">Créez votre compte pour accéder aux analyses.</p>
      <label for="insEmail" class="sr-only">Nouvelle adresse email</label>
      <input type="email" id="insEmail" placeholder="Nouvelle adresse email" autocomplete="email" required />
      <label for="insPhone" class="sr-only">Numéro de téléphone</label>
      <input type="tel" id="insPhone" placeholder="Numéro de téléphone (ex: 0197000000)" autocomplete="tel" required />
      <label for="insPassword" class="sr-only">Mot de passe (6 caractères minimum)</label>
      <input type="password" id="insPassword" placeholder="Mot de passe (6 caractères min.)" autocomplete="new-password" required />
      <button class="btn-inscription" onclick="creerCompte()">Créer mon compte</button>
      <button class="lien-switch" onclick="afficherConnexion()">Déjà un compte ? Se connecter</button>
    </section>

    <div id="loginMessage" role="alert" aria-live="polite" class="login-message"></div>
  </div>
</div>

<main id="contenu-principal" tabindex="0">
  <nav id="ateliersBar" class="ateliers-bar" aria-label="Barre des ateliers" hidden></nav>

  <section id="app-content" aria-live="polite" hidden>
    <aside id="bandeauExpiration" class="bandeau-expiration" role="alert" aria-live="assertive" hidden>
      <span id="bandeauTexte">⚠️ Votre abonnement expire bientôt !</span>
      <button onclick="contacterAdmin()">💬 Renouveler</button>
    </aside>

    <header class="topbar">
      <button id="btnBurger" class="burger-btn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="drawerMenu" onclick="ouvrirDrawer()">☰</button>

      <div class="topbar-logo-title">
        <img src="./logo.png" alt="Logo Loto Bénin" />
        <h1 class="topbar-title">Loto Bénin</h1>
      </div>

      <span id="statusBadge" class="status-badge" role="status" aria-live="polite">Chargement...</span>
    </header>

    <p id="statusCloud" role="status" aria-live="polite" class="status-cloud">⏳ Connexion à la base de données...</p>

    <nav class="tabs" role="tablist" aria-label="Navigation principale">
      <button class="tab-btn" id="tab-saisie" role="tab" aria-controls="onglet-saisie" aria-selected="true" tabindex="0" onclick="ouvrirOnglet('saisie', this)">📝 Compilation</button>
      <button class="tab-btn" id="tab-cockpit" role="tab" aria-controls="onglet-cockpit" aria-selected="false" tabindex="-1" onclick="ouvrirOnglet('cockpit', this)">🚀 Cockpit</button>
      <button class="tab-btn" id="tab-analyses" role="tab" aria-controls="onglet-analyses" aria-selected="false" tabindex="-1" onclick="ouvrirOnglet('analyses', this)">📊 Analyses</button>
    </nav>

    <section id="onglet-saisie" class="tab-content active" role="tabpanel" aria-labelledby="tab-saisie" tabindex="0">
      <!-- Contenu de saisie... -->
    </section>

    <section id="onglet-cockpit" class="tab-content" role="tabpanel" aria-labelledby="tab-cockpit" tabindex="0">
      <!-- Contenu cockpit... -->
    </section>

    <section id="onglet-analyses" class="tab-content" role="tabpanel" aria-labelledby="tab-analyses" tabindex="0">
      <!-- Contenu analyses... -->
    </section>

    <!-- SÉLECTEURS ET CONTENEUR ESSENTIELS POUR JAVASCRIPT -->
    <select id="selectSac" style="display:none;">
      <option value="tous">Vue Globale</option>
      <option value="Star">Star Bénin</option>
      <option value="Fortune">Fortune Bénin</option>
      <option value="Digital">Digital Bénin</option>
      <option value="Star_Digital">Star + Digital</option>
      <option value="Fortune_Digital">Fortune + Digital</option>
      <option value="Star_Fortune">Star + Fortune</option>
      <option value="Star_Fortune_Digital">Tous les jeux</option>
    </select>

    <select id="filtrePeriode" style="display:none;">
      <option value="recent" selected>Hier & Aujourd'hui</option>
      <option value="mois">Mois en cours</option>
      <option value="tout">Tout afficher</option>
    </select>

    <div id="conteneurSac" style="display:none;"></div>

    <!-- Dashboard -->
    <div class="dashboard-grid" id="dashboardAdmin">
      <div class="dash-card"><span class="num" id="dashTotal">—</span><span class="label">Total tirages</span></div>
      <div class="dash-card star"><span class="num" id="dashStar">—</span><span class="label">Star</span></div>
      <div class="dash-card fortune"><span class="num" id="dashFortune">—</span><span class="label">Fortune</span></div>
      <div class="dash-card digital"><span class="num" id="dashDigital">—</span><span class="label">Digital</span></div>
      <div class="dash-card date"><span class="num" id="dashDerniereDate">—</span><span class="label">Dernière saisie</span></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="app.js" defer></script>
</body>
</html>
