<!-- ====== ONGLET LABORATOIRE (MISE A JOUR) ====== -->
<div id="onglet-labo" class="tab-content">
  <div class="card">
    <h2>🧪 Laboratoire Avancé (Croisements & Multi-Lignes)</h2>
    
    <div class="lab-grid">
      
      <!-- BLOC GAUCHE : SELECTION MULTIPLE -->
      <div class="lab-box">
        <h3>1. Sélectionnez jusqu'à 5 tirages (Draws)</h3>
        <p style="font-size: 13px; color: #666;">Maintenez Ctrl (ou Cmd) pour sélectionner plusieurs lignes.</p>
        
        <select id="selectMultiTirages" multiple style="width: 100%; height: 200px; padding: 5px; border-radius: 6px;">
          <!-- Rempli par JS -->
        </select>

        <div style="margin-top: 15px;">
          <button onclick="executerAdditions()" style="background-color: #2980b9;">➕ Additionner (Point 15 & 18)</button>
          <button onclick="executerBankersMulti()" style="background-color: #f39c12;">🏦 Chercher Bankers Communs (Point 12-14)</button>
        </div>
      </div>

      <!-- BLOC DROIT : RESULTATS -->
      <div class="lab-box">
        <h3>2. Résultats des Opérations</h3>
        <div id="resultatLaboAvance" style="min-height: 200px; background: #fff; padding: 15px; border: 1px solid #ccc; border-radius: 6px;">
          <i>En attente de sélection...</i>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// Fonction pour charger les tirages dans le menu multiple
function remplirSelectMulti() {
  var tirages = charger();
  var select = document.getElementById("selectMultiTirages");
  select.innerHTML = "";
  
  if (tirages.length === 0) {
    select.innerHTML = "<option>Aucun tirage enregistré.</option>";
    return;
  }
  
  // Trier du plus récent au plus ancien
  tirages.sort(function(a, b) { return b.date.localeCompare(a.date); });
  
  tirages.forEach(function(t, index) {
    var opt = document.createElement("option");
    opt.value = index; 
    opt.textContent = t.date + " | " + t.jeu + " " + t.heure + " -> [" + t.boules.join(", ") + "]";
    select.appendChild(opt);
  });
}

// --- LOGIQUE 1 : ADDITION DE PLUSIEURS DRAWS (Points 15, 16, 18, 19) ---
function executerAdditions() {
  var select = document.getElementById("selectMultiTirages");
  var indicesSelectionnes = Array.from(select.selectedOptions).map(function(opt) { return parseInt(opt.value); });
  
  if (indicesSelectionnes.length < 2) {
    document.getElementById("resultatLaboAvance").innerHTML = "<span style='color:red;'>Veuillez sélectionner au moins 2 tirages.</span>";
    return;
  }

  var tirages = charger();
  tirages.sort(function(a, b) { return b.date.localeCompare(a.date); });
  
  // Récupérer les tirages sélectionnés
  var selection = indicesSelectionnes.map(function(i) { return tirages[i]; });
  
  var html = "<h4>Addition de " + selection.length + " Draws</h4>";
  html += "<ul style='font-size:13px; margin-bottom:15px;'>";
  selection.forEach(function(t) { html += "<li>" + t.jeu + " " + t.heure + " : " + t.boules.join(" - ") + "</li>"; });
  html += "</ul>";

  // A. Addition Globale (Point 15)
  var sommeGlobale = 0;
  selection.forEach(function(t) { t.boules.forEach(function(n) { sommeGlobale += n; }); });
  
  var reduitGlobal = sommeGlobale;
  while(reduitGlobal > 90) reduitGlobal -= 90;
  if (reduitGlobal === 0) reduitGlobal = 90; // Si multiple de 90

  html += "<div style='background:#eef5ef; padding:10px; margin-bottom:10px; border-radius:4px;'>";
  html += "<b>Addition Globale (Point 15) :</b><br>";
  html += "Somme totale = " + sommeGlobale + "<br>";
  html += "Numéro réduit : <span class='ball'>" + reduitGlobal + "</span>";
  html += "</div>";

  // B. Addition avec Position (Point 18)
  html += "<div style='background:#fff3cd; padding:10px; border-radius:4px;'>";
  html += "<b>Addition par Position (Point 18/19) :</b><br>";
  
  // Additionner boule par boule (1ère avec 1ère, 2ème avec 2ème, etc.)
  var additionsPositions = [0, 0, 0, 0, 0];
  selection.forEach(function(t) {
    for(var i=0; i<5; i++) { additionsPositions[i] += t.boules[i]; }
  });
  
  var htmlBoules = "";
  var grilleFinale = [];
  additionsPositions.forEach(function(somme) {
    var r = somme;
    while(r > 90) r -= 90;
    if(r === 0) r = 90;
    grilleFinale.push(r);
    htmlBoules += "<span class='ball'>" + r + "</span> ";
  });
  
  html += "1ère boule = " + additionsPositions[0] + " -> <b>" + grilleFinale[0] + "</b><br>";
  html += "2ème boule = " + additionsPositions[1] + " -> <b>" + grilleFinale[1] + "</b><br>";
  html += "3ème boule = " + additionsPositions[2] + " -> <b>" + grilleFinale[2] + "</b><br>";
  html += "4ème boule = " + additionsPositions[3] + " -> <b>" + grilleFinale[3] + "</b><br>";
  html += "5ème boule = " + additionsPositions[4] + " -> <b>" + grilleFinale[4] + "</b><br><br>";
  
  html += "<b>Nouvelle ligne générée :</b><br>" + htmlBoules;
  html += "</div>";

  document.getElementById("resultatLaboAvance").innerHTML = html;
}

// --- LOGIQUE 2 : BANKERS SUR DIFFERENTES LIGNES (Points 12, 13, 14) ---
function executerBankersMulti() {
  var select = document.getElementById("selectMultiTirages");
  var indicesSelectionnes = Array.from(select.selectedOptions).map(function(opt) { return parseInt(opt.value); });
  
  if (indicesSelectionnes.length < 2) {
    document.getElementById("resultatLaboAvance").innerHTML = "<span style='color:red;'>Veuillez sélectionner au moins 2 tirages pour croiser les Bankers.</span>";
    return;
  }

  var tirages = charger();
  tirages.sort(function(a, b) { return b.date.localeCompare(a.date); });
  var selection = indicesSelectionnes.map(function(i) { return tirages[i]; });
  
  // Compter la présence des numéros dans les différentes lignes
  var presence = {};
  selection.forEach(function(t) {
    t.boules.forEach(function(n) {
      presence[n] = (presence[n] || 0) + 1;
    });
  });

  // Trouver les numéros qui apparaissent dans TOUTES les lignes (ou au moins 2)
  var bankersCommuns = [];
  var autresCommuns = [];
  
  for (var num in presence) {
    if (presence[num] === selection.length) {
      bankersCommuns.push(num); // Présent dans toutes les lignes
    } else if (presence[num] > 1) {
      autresCommuns.push({ num: num, fois: presence[num] }); // Présent dans plusieurs lignes
    }
  }

  var html = "<h4>Analyse des Bankers Multi-Lignes</h4>";
  
  if (bankersCommuns.length > 0) {
    html += "<div style='background:#d4edda; padding:10px; border-radius:4px; margin-bottom:10px;'>";
    html += "<b>🎯 Bankers Communs (Présents sur TOUTES les lignes) :</b><br>";
    bankersCommuns.forEach(function(n) { html += "<span class='ball' style='background:#1a5c2a;'>" + n + "</span> "; });
    html += "</div>";
  } else {
    html += "<p><i>Aucun numéro n'est sorti sur toutes les lignes sélectionnées.</i></p>";
  }

  if (autresCommuns.length > 0) {
    html += "<div style='background:#f8f9fa; padding:10px; border-radius:4px; border: 1px solid #ddd;'>";
    html += "<b>Numéros récurrents (sur plusieurs lignes) :</b><br>";
    autresCommuns.sort(function(a,b) { return b.fois - a.fois; });
    autresCommuns.forEach(function(item) {
      html += "<span class='ball' style='background:#6c757d;'>" + item.num + "</span> (sorti " + item.fois + " fois)<br>";
    });
    html += "</div>";
  }

  document.getElementById("resultatLaboAvance").innerHTML = html;
}

// Mettre à jour l'initialisation pour charger le menu multiple
var ancienneFonctionOuvrir = ouvrirOnglet;
ouvrirOnglet = function(id) {
  ancienneFonctionOuvrir(id);
  if(id === 'labo') {
    remplirSelectMulti();
  }
};
</script>
